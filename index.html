<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>綴 Tsuzuri</title>
  <meta name="description" content="こころを整え、毎日のよいことに気づくための、プライベートなジャーナル">
  <meta name="theme-color" content="#f3f4f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151918" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tsuzuri">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // テーマのちらつき防止
    try {
      var s = JSON.parse(localStorage.getItem('tsuzuri.settings') || '{}');
      if (s.theme && s.theme !== 'system') document.documentElement.dataset.theme = s.theme;
    } catch (e) {}
  </script>
</head>
<body>
  <!-- ロック画面 -->
  <div id="lock" class="lock" hidden>
    <form id="lockForm" class="lock-card" autocomplete="off">
      <div class="lock-logo">綴</div>
      <h1>ジャーナルはロックされています</h1>
      <p class="muted">パスフレーズを入力してください。</p>
      <input id="lockPass" type="password" placeholder="パスフレーズ" autocomplete="current-password" required>
      <p id="lockError" class="error" hidden>パスフレーズが違います</p>
      <button class="btn primary block" type="submit" id="lockSubmit">ロック解除</button>
    </form>
  </div>

  <!-- モバイル用トップバー -->
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="メニュー"><span data-ic="menu"></span></button>
    <div class="brand-sm">綴</div>
    <button class="icon-btn" id="topSearchBtn" aria-label="検索"><span data-ic="search"></span></button>
  </header>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">綴</span><span class="brand-name">Tsuzuri<small>こころのジャーナル</small></span></div>
      <button class="btn primary block" id="newEntryBtn">＋ 書く</button>
      <div class="search">
        <input id="searchInput" type="search" placeholder="検索…  (Ctrl+K)" aria-label="検索">
      </div>
      <nav class="nav" id="nav">
        <button data-view="home"><span data-ic="home"></span>ホーム</button>
        <button data-view="list"><span data-ic="journal"></span>記録</button>
        <button data-view="calendar"><span data-ic="calendar"></span>カレンダー</button>
        <button data-view="stats"><span data-ic="leaf"></span>こころの傾向</button>
        <button data-view="guide"><span data-ic="guide"></span>ガイド</button>
        <button data-view="settings"><span data-ic="settings"></span>設定</button>
      </nav>
      <div class="side-section" id="tagSection">
        <h4>タグ</h4>
        <div id="tagList" class="tag-list"></div>
      </div>
      <div class="side-foot" id="sideFoot"></div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <nav class="bottombar" id="bottombar" aria-label="メインナビゲーション">
    <button data-view="home"><span data-ic="home"></span>ホーム</button>
    <button data-view="list"><span data-ic="journal"></span>記録</button>
    <button class="bb-add" id="bbAdd" aria-label="書く"><span data-ic="plus"></span></button>
    <button data-view="calendar"><span data-ic="calendar"></span>カレンダー</button>
    <button data-view="stats"><span data-ic="leaf"></span>傾向</button>
  </nav>

  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/markdown.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/db.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
